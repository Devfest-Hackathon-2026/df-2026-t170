name: Deploy frontend to Firebase hosting

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  REGION: asia-northeast1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set envs by branch
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "service_name=nextjs-frontend-prod" >> $GITHUB_OUTPUT
          else
            echo "service_name=nextjs-frontend-dev" >> $GITHUB_OUTPUT
          fi

      - name: Set backend URL by branch
        id: backend
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "url=${{ secrets.BACKEND_API_URL_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ secrets.BACKEND_API_URL_DEV }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloud Run from Source
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ steps.vars.outputs.service_name }}
          source: ./frontend
          region: ${{ env.REGION }}
          # --set-build-env-vars でビルド時に NEXT_PUBLIC_ 変数を埋め込む
          # --set-env-vars はランタイム環境変数として渡す
          # BACKEND_API_URL はサーバーサイド専用のため NEXT_PUBLIC_ 不要
          flags: >-
            --allow-unauthenticated
            --port 8080
            --set-build-env-vars NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            --set-env-vars NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }},BACKEND_API_URL=${{ steps.backend.outputs.url }}
