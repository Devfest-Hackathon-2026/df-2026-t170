steps:
  # .env.production を生成してビルド時に NEXT_PUBLIC_ 変数を確実に埋め込む
  - name: 'alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}" > .env.production'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE}'

images:
  - '${_IMAGE}'

substitutions:
  _NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ''
  _IMAGE: ''
